<!doctype html><html lang="ja" data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://api.github.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; manifest-src 'self'; base-uri 'none'; form-action 'none';"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ふたりの信州暮らし帳</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="暮らし帳">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="description" content="松本・塩尻・安曇野での同棲にかかるお金の試算と、2人で使う家計簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#1C2A27; --muted:#5B6D68; --faint:#8A9A95;
  --line:#D7E0DC; --accent:#2F6B5B; --accent-soft:#DCEBE5; --on-accent:#FFFFFF;
  --pa:#4262B0; --pa-soft:#E1E8F7; --pb:#D9714A; --pb-soft:#FAE6DC;
  --good:#2E8A58; --good-soft:#DDF0E4; --warn:#B7801F; --warn-soft:#F7ECD6; --bad:#BF4337; --bad-soft:#F8E0DD;
  --c-home:#2F6B5B; --c-util:#D2A03A; --c-comm:#6A8ED4; --c-food:#DD7A52; --c-fun:#C35E8B; --c-life:#89A558; --c-car:#587B87; --c-other:#A69A8B;
  --shadow:0 1px 2px rgba(28,42,39,.05),0 6px 20px -8px rgba(28,42,39,.12);
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"Outfit","Zen Kaku Gothic New",system-ui,sans-serif;
  /* 端末が暗いテーマでも、このページは白で通す */
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px 14px;position:relative}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;line-height:1.25;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ridge{display:block;width:170px;height:26px;color:var(--accent);opacity:.55;margin-bottom:4px}
.pair{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--f-disp)}
.dot.a{background:var(--pa)} .dot.b{background:var(--pb)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

/* nav */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px 12px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:not([aria-selected="true"]):hover{background:var(--surface-2);color:var(--ink)}

/* layout */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:860px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2{font-family:var(--f-disp);font-size:17px;font-weight:700;margin:0 0 4px;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:center}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.big{font-family:var(--f-num);font-weight:600;font-size:clamp(38px,7vw,56px);line-height:1;letter-spacing:-.01em}
.big small{font-size:.38em;font-weight:500;color:var(--muted);margin-left:4px;font-family:var(--f-body)}
.lead{margin:10px 0 0;color:var(--muted);max-width:44ch}
.lead b{color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700;color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}

/* people split */
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{border-radius:14px;padding:14px;background:var(--surface-2);border:1px solid var(--line)}
.person.a{background:var(--pa-soft);border-color:transparent} .person.b{background:var(--pb-soft);border-color:transparent}
.person .n{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.person .v{font-family:var(--f-num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.person .m{font-size:12px;color:var(--muted)}

/* donut */
.donut{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
@media (max-width:460px){.donut{grid-template-columns:1fr;justify-items:center}}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%;font-size:13px}
.legend li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .p{color:var(--faint);font-family:var(--f-num);font-size:12px;width:34px;text-align:right}

/* forms */
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;min-width:0}
.in:hover{border-color:var(--faint)}
.in.yen{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.yenwrap{position:relative}
.yenwrap::before{content:"¥";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-family:var(--f-num);font-size:14px;pointer-events:none}
.yenwrap .in{padding-left:22px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:5px 10px;font-size:13px}
.icon{border:0;background:transparent;color:var(--faint);cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex:none}
.icon:hover{background:var(--bad-soft);color:var(--bad)}
.choice{display:flex;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;flex-wrap:wrap}
.choice button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);flex:1 0 auto}
.choice button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.choice button[aria-pressed="true"].pa{color:var(--pa)} .choice button[aria-pressed="true"].pb{color:var(--pb)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* item lists */
.group{border-top:1px solid var(--line);padding-top:12px}
.group:first-child{border-top:0;padding-top:0}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ghead h3{font-size:14px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700}
.ghead h3 i{width:10px;height:10px;border-radius:3px}
.ghead .num{font-weight:600;color:var(--muted);font-size:14px}
.item{display:grid;grid-template-columns:1fr 140px 30px;gap:8px;align-items:center;padding-block:4px}
.item.chk{grid-template-columns:20px 22px 1fr 140px 30px 30px 30px}
.item.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.item .in{padding:6px 8px;font-size:14px}
/* 名前は長くても全部見えるように折り返す。高さは中身に合わせて伸ばす（autoGrow） */
.item textarea.lbl{resize:none;overflow:hidden;line-height:1.5;min-height:32px;white-space:pre-wrap;
  word-break:break-word;font-family:var(--f-body);display:block}
.item.chk{align-items:center}
.item.off .lbl,.item.off .yen{color:var(--faint);text-decoration:line-through}
.hint{font-size:12px;color:var(--faint);grid-column:1/-1;margin:-4px 0 2px}
.item.chk .hint{grid-column:3/-1}
.item .memo{flex-wrap:wrap}
/* 項目ごとのメモ。見積もりの比較や「母からもらう」などを書ける */
.item .memo{grid-column:3/-1;display:flex;gap:8px;align-items:center;margin:2px 0 6px}
.item .memo .in{padding:6px 10px;font-size:13px}
.icon.memobtn:hover{background:var(--accent-soft);color:var(--accent)}
.icon.memobtn.on{color:var(--accent)}
/* 商品ページへのリンク */
a.icon.linkbtn{text-decoration:none;color:var(--accent);font-size:15px}
a.icon.linkbtn:hover{background:var(--accent-soft)}
.linkhint{display:flex;align-items:center;gap:6px;font-size:12px}
.linkhint a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26ch}
.linkhint a:hover{text-decoration:underline}
.item .memo .in{flex:1 1 100%}
.item.off .memo{opacity:.5}
/* 長押しで並べ替え */
/* 上から数えた順位で色を変える。上ほど優先度が高い扱い */
.item.chk[data-idx]{border-radius:10px;border-left:4px solid transparent;padding-left:8px;margin-left:-12px}
.item.chk.pri1{border-left-color:var(--bad);background:var(--bad-soft)}
.item.chk.pri2{border-left-color:var(--pb);background:var(--pb-soft)}
.item.chk.pri3{border-left-color:var(--warn);background:var(--warn-soft)}
.item.chk.pri4{border-left-color:var(--good)}
.item.chk.prioff{border-left-color:var(--line)}
.item.chk.pri1 .in,.item.chk.pri2 .in,.item.chk.pri3 .in{background:var(--surface)}
.item.chk.pri1 .grip{color:var(--bad)}
.item.chk.pri2 .grip{color:var(--pb)}
.item.chk.pri3 .grip{color:var(--warn)}
.grip{color:var(--faint);font-size:15px;line-height:1;cursor:grab;touch-action:none;text-align:center;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grip:hover{color:var(--accent)}
.item.chk.dragging .grip{cursor:grabbing;color:var(--accent)}
.item.chk.dragging{background:var(--accent-soft);box-shadow:var(--shadow);position:relative;z-index:2;touch-action:none}
.item.chk.dragging .in{background:var(--surface)}
body.dragbusy{overflow:hidden;user-select:none;-webkit-user-select:none}
body.dragbusy .item.chk{transition:transform .12s}
@media (max-width:460px){.item{grid-template-columns:1fr 112px 30px}}
/* 狭い画面では、名前が細長い柱にならないように横並びをやめる。
   1行目＝つまみ・チェック・名前、2行目＝金額とボタン */
@media (max-width:560px){
  .item.chk{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .item.chk .grip{flex:0 0 14px}
  .item.chk>input[type=checkbox]{flex:0 0 20px}
  .item.chk .lbl{flex:1 1 140px;min-width:0}
  .item.chk .yenwrap{flex:1 1 110px;margin-left:34px}
  .item.chk .icon{flex:0 0 28px}
  .item.chk .hint,.item.chk .memo{flex:1 1 100%;margin-left:34px}
  .item.chk .by{display:none}
}

/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-num)}
tr.cur td{background:var(--accent-soft)}
tr.cur td:first-child{font-weight:700}
table.sched td{padding-block:5px}
table.sched .in{padding:5px 8px 5px 22px;font-size:14px}
table.sched .in.ov{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

/* budget vs actual */
.bva{display:grid;gap:10px}
.bva .r{display:grid;grid-template-columns:110px 1fr 150px;gap:10px;align-items:center;font-size:13px}
@media (max-width:520px){.bva .r{grid-template-columns:90px 1fr;}.bva .r .amt{grid-column:2}}
.bva .track{height:12px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line)}
.bva .track span{position:absolute;inset:0 auto 0 0;border-radius:99px}
.bva .amt{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}
.bva .amt b{color:var(--ink);font-weight:600}
.over{color:var(--bad)!important}

.explist{list-style:none;margin:0;padding:0}
.explist li{display:grid;grid-template-columns:52px 1fr auto 30px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.explist li:last-child{border-bottom:0}
.explist .d{font-family:var(--f-num);color:var(--muted);font-size:13px}
.explist .t{min-width:0}
.explist .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.explist .t small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.explist .t small i{width:8px;height:8px;border-radius:2px;display:inline-block}
.explist .a{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:700}
.tag.a{background:var(--pa-soft);color:var(--pa)} .tag.b{background:var(--pb-soft);color:var(--pb)} .tag.j{background:var(--accent-soft);color:var(--accent)}

.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--faint);margin:10px 0 0}
.callout{border-radius:12px;padding:12px 14px;background:var(--accent-soft);font-size:14px}
.callout.warn{background:var(--warn-soft)}
.callout b{font-weight:700}
svg text{font-family:var(--f-num)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
textarea.in{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px}

/* todo */
.todos{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.todos li{display:grid;grid-template-columns:22px 1fr auto auto 30px;gap:10px;align-items:center;
  padding:11px 13px;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;background:var(--surface)}
.todos li.st-over{background:var(--bad-soft);border-color:transparent;border-left-color:var(--bad)}
.todos li.st-soon{background:var(--warn-soft);border-color:transparent;border-left-color:var(--warn)}
.todos li.st-later{border-left-color:var(--accent)}
.todos li.st-none{border-left-color:var(--faint)}
.todos li.st-done{background:transparent;border-color:var(--line);border-left-color:var(--line);opacity:.6}
.todos input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.todos li.st-over input[type=checkbox]{accent-color:var(--bad)}
.todos li.st-soon input[type=checkbox]{accent-color:var(--warn)}
.todos .t{min-width:0;overflow-wrap:anywhere;font-weight:500}
.todos li.st-over .t{color:var(--bad)}
.todos li.st-done .t{color:var(--faint);text-decoration:line-through;font-weight:400}
.todos .due{font-size:12px;font-weight:700;font-family:var(--f-num);white-space:nowrap;
  padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.todos li.st-over .due{background:var(--surface);color:var(--bad)}
.todos li.st-soon .due{background:var(--surface);color:var(--warn)}
.todos li.st-later .due{background:var(--accent-soft);color:var(--accent)}
.todos li.st-done .due{background:transparent;color:var(--faint);font-weight:400}
.todos .by{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.todos li.st-done .by{background:var(--surface-2)!important;color:var(--faint)!important}
.todos .by:empty{visibility:hidden;padding:0}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.todoform{display:flex;gap:8px;flex-wrap:wrap}
.todoform .in.text{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

const $ = s=>document.querySelector(s);
const clone = o=>JSON.parse(JSON.stringify(o));
const yen = n=>(n<0?"−":"")+"¥"+Math.abs(Math.round(n||0)).toLocaleString("ja-JP");
const man = n=>{ const v=Math.round(n/1000)/10; return (Number.isInteger(v)?v:v.toFixed(1))+"万"; };

const uid = ()=>Math.random().toString(36).slice(2,9);
const todayStr = ()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function addMonths(ym, n){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymLabel(ym){ const [y,m]=ym.split("-"); return y+"年"+Number(m)+"月"; }
function monthsBetween(a,b){ const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number); return (y2-y1)*12+(m2-m1); }

let S = clone(DEFAULT);
S.savings.moveIn = addMonths(todayStr().slice(0,7), 9);
let expenses = [];
let chat = [];
let todos = [];
let tab = "home";
let editBudget = false;
let openNotes = new Set();   /* メモ欄を開いている初期費用の項目 */
let month = todayStr().slice(0,7);

function normalize(d){
  const o = Object.assign(clone(DEFAULT), d||{});
  o.savings = Object.assign(clone(DEFAULT.savings), (d&&d.savings)||{});
  if (!Array.isArray(o.savings.bonuses)) o.savings.bonuses = clone(DEFAULT.savings.bonuses);
  if (!o.savings.overrides || typeof o.savings.overrides!=="object") o.savings.overrides = {};
  if (!o.savings.moveIn) o.savings.moveIn = addMonths(todayStr().slice(0,7), 9);

/* ---------- 計算 ---------- */
const rent = ()=> (S.budget.find(b=>b.id==="rent")||{amt:0}).amt;
const net = i=> S.incomeType==="gross" ? Math.round((+S.incomes[i]||0)*0.78) : (+S.incomes[i]||0);
const netTotal = ()=> net(0)+net(1);
const monthly = ()=> S.budget.reduce((a,b)=>a+(+b.amt||0),0);
const groupSum = k=> S.budget.filter(b=>b.g===k).reduce((a,b)=>a+(+b.amt||0),0);
const iAmt = it=> it.m!=null ? Math.round(rent()*it.m) : (+it.amt||0);
function shareOf(i, how){
  how = how||S.split;
  if (how==="half") return .5;
  if (how==="fixed"){ const t=(+S.fixed[0]||0)+(+S.fixed[1]||0); return t? (+S.fixed[i]||0)/t : .5; }
  const t=netTotal(); return t? net(i)/t : .5;
}
function payOf(i, how){
  how = how||S.split;
  if (how==="fixed") return +S.fixed[i]||0;
  return monthly()*shareOf(i,how);
}
function initialNeeded(){ return S.initial.filter(x=>!x.off).reduce((a,x)=>a+iAmt(x),0); }
function target(){ return initialNeeded() + (S.savings.cushion? monthly():0); }
/* 月ごとの貯金額：ふだんの額（月別に上書き可）＋ボーナス */
function monthRow(ym){
  const ov=(S.savings.overrides||{})[ym];
  const reg=[0,1].map(i=> ov && ov[i]!=null ? +ov[i]||0 : +S.savings.monthly[i]||0);
  const mo=Number(ym.slice(5));
  const bonus=[0,1].map(i=> (S.savings.bonuses||[]).filter(b=>+b.m===mo).reduce((a,b)=>a+(+(b.amt||[])[i]||0),0));
  return {ym, reg, bonus, ov:!!ov, total:reg[0]+reg[1]+bonus[0]+bonus[1]};
}
function plan(){
  const tgt=target(), cur=+S.savings.current||0, rem=Math.max(0,tgt-cur);
  const per=(+S.savings.monthly[0]||0)+(+S.savings.monthly[1]||0);
  const nowYm=todayStr().slice(0,7);
  const until = Math.max(1, monthsBetween(nowYm, S.savings.moveIn||addMonths(nowYm,9)));
  const cum=[cur]; let months = rem===0 ? 0 : Infinity;
  for(let i=0;i<120;i++){ cum.push(cum[i]+monthRow(addMonths(nowYm,i)).total); if(!isFinite(months) && cum[i+1]>=tgt) months=i+1; if(i>=until && isFinite(months)) break; }
  const reach = isFinite(months) && months>0 ? addMonths(nowYm, months-1) : null;
  let bonusBefore=0; for(let i=0;i<until;i++){ const r=monthRow(addMonths(nowYm,i)); bonusBefore+=r.bonus[0]+r.bonus[1]; }
  const need = Math.max(0, rem-bonusBefore)/until;
  const atMoveIn = cum[Math.min(until,cum.length-1)];
  const bonusYear=(S.savings.bonuses||[]).reduce((a,b)=>a+(+b.amt[0]||0)+(+b.amt[1]||0),0);
  return {tgt,cur,rem,per,months,reach,until,need,nowYm,cum,atMoveIn,bonusBefore,bonusYear};
}
function utilByMonth(){
  const out=new Array(12).fill(0);
  S.budget.filter(b=>b.g==="util").forEach(b=>{ const f=SEASON[b.season]; for(let m=0;m<12;m++) out[m]+=(+b.amt||0)*(f?f[m]:1); });

}

/* ---------- 保存・同期（GitHubのファイルに直接保存する） ---------- */
/* 設定と家計簿を、このサイトと同じリポジトリのJSONファイルに読み書きする。

const GH = {
  owner:"harutong08", repo:"futari-kurashicho", branch:"main",
  paths:{ settings:"data/settings.json", expenses:"data/expenses.json", chat:"data/chat.json", todos:"data/todos.json" }

/* 末尾に / を付けないこと。付けるとGitHubが400を返し、その応答にはCORSヘッダが無いので

const API = "https://api.github.com/repos/"+GH.owner+"/"+GH.repo;
const READONLY_MSG = "いまは見るだけの状態です。「毎月の予算」タブの『2人で同期する』からつなぐと保存できます";
/* 相手の変更を読みに行く間隔。トークンありは1時間5,000回まで使えるので、10秒でも

const POLL_MS = { github:10000, readonly:300000 };

const APP_VERSION = "2026-09-23d";
const TOKEN_KEY = "futari.token";

let token = "";

let syncedChat = new Set();

function b64enc(str){
  const b=new TextEncoder().encode(str); let s=""; const CH=0x8000;
  for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null, b.subarray(i,i+CH));
  return btoa(s);
}
function b64dec(b64){
  const bin=atob(String(b64||"").replace(/\s/g,"")); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function ghHeaders(extra){
  const h=Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}, extra||{});
  if (token) h.Authorization="Bearer "+token;
  return h;
}
async function ghFetch(url, init){
  try{ return await fetch(url, init); }
  catch(e){ throw new Error("GitHubに届きませんでした（オフライン、通信の遮断、ブラウザの拡張機能などの可能性）"); }
}
async function ghErr(r, where){
  let m=""; try{ const j=await r.json(); m=j.message||""; }catch(e){}
  const tail = "（"+r.status+(m? "："+m : "")+"）";
  if (r.status===401) return "トークンが違うか、期限切れです。貼り付けたときに前後の空白が入っていないかも確かめてください"+tail;
  if (r.status===403 && /rate limit/i.test(m)) return "GitHubの回数制限です。少し待つと戻ります"+tail;
  if (r.status===404 && where==="repo") return "トークンの Repository access に "+GH.owner+"/"+GH.repo+" が選ばれていないようです。トークンを作り直すか、対象のリポジトリを選び直してください"+tail;
  if (r.status===403 && where==="repo") return "トークンでこのリポジトリを読めません。Repository access と Permissions の Contents を確かめてください"+tail;
  if (r.status===403 || r.status===404) return "このリポジトリに書き込む権限がありません。トークンの Permissions → Contents が Read and write になっているか確かめてください"+tail;
  if (r.status===409 || r.status===422) return "他の端末の保存とぶつかりました"+tail;
  return "GitHubのエラー"+tail;
}
async function ghGet(key){
  const url=API+"/contents/"+GH.paths[key]+"?ref="+encodeURIComponent(GH.branch)+"&t="+Date.now();
  const r=await ghFetch(url,{headers:ghHeaders(), cache:"no-store"});
  if (r.status===404) return {missing:true, sha:null, data:null};
  if (!r.ok) throw new Error(await ghErr(r, "file"));
  const j=await r.json();
  let data=null; try{ data=JSON.parse(b64dec(j.content)); }catch(e){ data=null; }
  return {missing:false, sha:j.sha, data};
}
async function ghPut(key, data, curSha, message){
  const body={message, content:b64enc(JSON.stringify(data,null,1)), branch:GH.branch};
  if (curSha) body.sha=curSha;
  const r=await ghFetch(API+"/contents/"+GH.paths[key], {method:"PUT", headers:ghHeaders({"Content-Type":"application/json"}), body:JSON.stringify(body)});
  if (r.status===409 || r.status===422) return {conflict:true};
  if (!r.ok) throw new Error(await ghErr(r, "write"));
  const j=await r.json();
  return {sha:j.content && j.content.sha};
}

/* 見るだけの状態（GitHub側にデータはあるがトークンがない）でだけ入力を止める。
   まだ同期していない端末では、これまでどおりブラウザに保存する。 */
/* ===== 合言葉による暗号化 =====
   ブラウザ標準の WebCrypto を使う。合言葉から PBKDF2(SHA-256, 20万回) で鍵を作り、
   AES-GCM で本文を包む。GitHubに置かれるのは下の封筒だけなので、
   合言葉を知らない人にはただの文字列にしか見えない。
   塩は合言葉ごとに1つ作って使い回す（毎回変えると鍵の作り直しで遅くなるため）。
   IVは保存のたびに新しく作る（これがAES-GCMで大事な方）。 */
function isEnc(d){ return !!(d && typeof d==="object" && d.enc==="aes-gcm" && d.data); }
function b64bytes(b64){ const bin=atob(String(b64||"")); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function bytesB64(a){ let s=""; const CH=0x8000; for(let i=0;i<a.length;i+=CH) s+=String.fromCharCode.apply(null,a.subarray(i,i+CH)); return btoa(s); }
async function deriveKey(p, salt){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:KDF_ITER, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function keyFor(salt){
  const tag=bytesB64(salt);
  if (cryptoKey && cryptoKey.tag===tag && cryptoKey.pass===pass) return cryptoKey.key;
  const key=await deriveKey(pass, salt);
  cryptoKey={tag, pass, key};
  return key;
}
async function seal(value){
  if (!pass) return value;
  if (!cryptoSalt) cryptoSalt=crypto.getRandomValues(new Uint8Array(16));
  const key=await keyFor(cryptoSalt);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(value)));
  return {v:1, enc:"aes-gcm", kdf:"pbkdf2-sha256", iter:KDF_ITER,
          salt:bytesB64(cryptoSalt), iv:bytesB64(iv), data:bytesB64(new Uint8Array(ct))};
}
/* 開けたら中身を返す。開けないときは undefined。
   設定ファイルが開けないときだけ全体を閉じる（locked）。家計簿やチャットが1つ開けないだけで
   全部閉じてしまうと、正しい合言葉で開いた直後に閉じ直す動きになってしまうため。 */
async function open(d, which){
  if (!isEnc(d)){ if(which) encTrouble.delete(which); return d; }
  const fail=()=>{ if(which==="settings"||!which) locked=true; if(which) encTrouble.add(which); return undefined; };
  if (!pass) return fail();
  try{
    const salt=b64bytes(d.salt);
    const key=await keyFor(salt);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64bytes(d.iv)}, key, b64bytes(d.data));
    if (which==="settings" || !cryptoSalt) cryptoSalt=salt;
    if (which) encTrouble.delete(which);
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return fail(); }
}
async function canOpen(d, p){
  if (!isEnc(d)) return true;
  try{
    const salt=b64bytes(d.salt);
    const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:+d.iter||KDF_ITER, hash:"SHA-256"}, base,
      {name:"AES-GCM", length:256}, false, ["decrypt"]);
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b64bytes(d.iv)}, key, b64bytes(d.data));
    return true;
  }catch(e){ return false; }
}

function canWrite(){ return mode!=="readonly" && !locked; }

/* 招待リンク（…/#t=github_pat_…）からトークンを受け取る。
   「#」より後ろはサーバーに送られないので、GitHub Pages のログにも残らない。
   受け取ったら即座にアドレス欄から消して、履歴にも残さない。 */
function takeInviteToken(){
  const out={token:"", pass:""};
  try{
    const h=location.hash||"";
    const t=/(?:^#|[#&])t=([^&]+)/.exec(h), k=/(?:^#|[#&])k=([^&]+)/.exec(h);
    if (t) out.token=decodeURIComponent(t[1]).trim();
    if (k) out.pass=decodeURIComponent(k[1]);
    if (t||k) history.replaceState(null, "", location.pathname+location.search);
  }catch(e){}
  return out;
}
function inviteUrl(){
  return location.origin+location.pathname+"#t="+encodeURIComponent(token)+(pass? "&k="+encodeURIComponent(pass) : "");
}
function nudge(){
  const now=Date.now(); if (now-lastNudge < 20000) return; lastNudge=now; toast(READONLY_MSG);
}
function markDirty(){ localDirty=true; setSync(); nudge(); }

function setSync(){
  const el=$("#sync"); if(!el) return;
  el.classList.toggle("on", mode==="github" && !lastErr && !locked);
  const txt = locked ? "合言葉まち"
    : lastErr ? lastErr
    : busy ? "保存中…"
    : mode==="github" ? (pass? "2人で同期中（暗号化）" : "2人で同期中")
    : mode==="readonly" ? (localDirty? "見るだけ・変更は未保存" : "見るだけ（保存はしていません）")
    : "この端末だけに保存";
  const s=el.querySelector("span"); if(s) s.textContent=txt;
  el.title=txt;
}

function saveLocalSettings(){ try{ localStorage.setItem("futari.settings", JSON.stringify(S)); }catch(e){} }
function saveLocalExpenses(){ try{ localStorage.setItem("futari.expenses", JSON.stringify(expenses)); }catch(e){} }

function loadLocal(){

}

/* fast=true は項目の追加・削除など、形が変わる操作。すぐ送る。
   文字を打っているときは、打鍵のたびに送らないよう少し待つ。 */
function scheduleSave(fast){
  settingsDirty = true;
  saveLocalSettings();
  if (mode!=="github"){ if(mode==="readonly") markDirty(); return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushSettings, fast? 250 : 900);
}

}

async function pushSettings(){
  if (mode!=="github" || locked) return;
  const data=clone(S), json=JSON.stringify(data);
  if (json===pushed.settings) return;
  busy++; setSync();
  try{
    for (let i=0;i<3;i++){
      const r=await ghPut("settings", await seal(data), sha.settings, "家計：設定を更新");
      if (r.conflict){ const g=await ghGet("settings"); sha.settings=g.sha; continue; }
      sha.settings=r.sha; pushed.settings=json; lastErr="";
      /* 送っている間にまた触っていたら、もう一度送る。そうでなければ未送信フラグを下ろす */
      if (JSON.stringify(S)===json) settingsDirty=false; else scheduleSave(true);
      break;
    }
  }catch(e){ lastErr=e.message; toast("保存できませんでした："+e.message); }
  busy--; setSync();
}

function sortExp(list){
  return list.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||((b.createdAt||0)-(a.createdAt||0)));
}
function mergeExp(remote, local){
  const map=new Map();
  (remote||[]).forEach(e=>{ if(e&&e.id && !deletedIds.has(e.id)) map.set(e.id,e); });
  (local||[]).forEach(e=>{ if(e&&e.id && !deletedIds.has(e.id)) map.set(e.id,e); });
  return sortExp([...map.values()]);
}
function saveChatSoon(){
  saveLocalChat();
  if (mode!=="github"){ if(mode==="readonly") markDirty(); return; }
  clearTimeout(chatTimer);
  chatTimer=setTimeout(pushChat, 300);
}
function sortChat(list){ return list.slice().sort((a,b)=>(a.at||0)-(b.at||0)); }
function mergeChat(remote, local){
  const map=new Map();
  (remote||[]).forEach(m=>{ if(m&&m.id && !deletedChat.has(m.id)) map.set(m.id,m); });
  (local||[]).forEach(m=>{ if(m&&m.id && !deletedChat.has(m.id)) map.set(m.id,m); });
  return sortChat([...map.values()]).slice(-MSG_MAX);
}
async function pushChat(){
  if (mode!=="github" || locked) return;
  busy++; setSync();
  try{
    for (let i=0;i<3;i++){
      const g=await ghGet("chat");
      const opened=g.missing? [] : await open(g.data, "chat");
      if (opened===undefined){ lastErr="チャットが別の合言葉で保存されています"; break; }
      const merged=mergeChat(Array.isArray(opened)?opened:[], chat);
      const json=JSON.stringify(merged);
      if (!g.missing && json===pushed.chat){ sha.chat=g.sha; break; }
      const r=await ghPut("chat", await seal(merged), g.sha, "家計：チャットを更新");
      if (r.conflict) continue;
      sha.chat=r.sha; pushed.chat=json; lastErr="";
      chat=merged; syncedChat=new Set(merged.map(m=>m.id)); saveLocalChat();
      if (!editing()) render();
      break;
    }
  }catch(e){ lastErr=e.message; toast("送れませんでした："+e.message); }
  busy--; setSync();
}
function adoptChat(remote){
  const list=Array.isArray(remote)? remote.filter(m=>m&&m.id && !deletedChat.has(m.id)) : [];
  const ids=new Set(list.map(m=>m.id));
  const unsent=chat.filter(m=>m&&m.id && !ids.has(m.id) && !syncedChat.has(m.id));
  const next=sortChat(list.concat(unsent)).slice(-MSG_MAX);
  syncedChat=ids;
  const changed=JSON.stringify(next)!==JSON.stringify(chat);
  chat=next; saveLocalChat();
  if (!unsent.length) pushed.chat=JSON.stringify(next);
  return changed;
}
function unreadCount(){
  if (me===null) return 0;
  return chat.filter(m=>m.who!==me && (m.at||0)>chatSeen).length;
}
function markChatSeen(){
  const last=chat.length? Math.max(...chat.map(m=>m.at||0)) : 0;
  if (last>chatSeen){ chatSeen=last; try{ localStorage.setItem(SEEN_KEY, String(chatSeen)); }catch(e){} }
}

function saveTodosSoon(){
  saveLocalTodos();
  if (mode!=="github"){ if(mode==="readonly") markDirty(); return; }
  clearTimeout(todoTimer);
  todoTimer=setTimeout(pushTodos, 500);
}
/* 期限が近い順、期限なしは後ろ。終わったものはいちばん下 */
function sortTodos(list){
  return list.slice().sort((a,b)=>{
    if (!!a.done !== !!b.done) return a.done? 1 : -1;
    const ad=a.due||"9999-99-99", bd=b.due||"9999-99-99";
    if (ad!==bd) return ad<bd? -1 : 1;
    return (a.at||0)-(b.at||0);
  });
}
function mergeTodos(remote, local){
  const map=new Map();
  (remote||[]).forEach(t=>{ if(t&&t.id && !deletedTodo.has(t.id)) map.set(t.id,t); });
  (local||[]).forEach(t=>{ if(t&&t.id && !deletedTodo.has(t.id)) map.set(t.id,t); });
  return sortTodos([...map.values()]);
}
async function pushTodos(){
  if (mode!=="github" || locked) return;
  busy++; setSync();
  try{
    for (let i=0;i<3;i++){
      const g=await ghGet("todos");
      const opened=g.missing? [] : await open(g.data, "todos");
      if (opened===undefined){ lastErr="やることリストが別の合言葉で保存されています"; break; }
      const merged=mergeTodos(Array.isArray(opened)?opened:[], todos);
      const json=JSON.stringify(merged);
      if (!g.missing && json===pushed.todos){ sha.todos=g.sha; break; }
      const r=await ghPut("todos", await seal(merged), g.sha, "家計：やることリストを更新");
      if (r.conflict) continue;
      sha.todos=r.sha; pushed.todos=json; lastErr="";
      todos=merged; syncedTodo=new Set(merged.map(t=>t.id)); saveLocalTodos();
      if (!editing()) render();
      break;
    }
  }catch(e){ lastErr=e.message; toast("保存できませんでした："+e.message); }
  busy--; setSync();
}
function adoptTodos(remote){
  const list=Array.isArray(remote)? remote.filter(t=>t&&t.id && !deletedTodo.has(t.id)) : [];
  const ids=new Set(list.map(t=>t.id));
  const unsent=todos.filter(t=>t&&t.id && !ids.has(t.id) && !syncedTodo.has(t.id));
  const next=sortTodos(list.concat(unsent));
  syncedTodo=ids;
  const changed=JSON.stringify(next)!==JSON.stringify(todos);
  todos=next; saveLocalTodos();
  if (!unsent.length) pushed.todos=JSON.stringify(next);
  return changed;
}

async function pushExpenses(){
  if (mode!=="github" || locked) return;
  busy++; setSync();
  try{
    for (let i=0;i<3;i++){
      const g=await ghGet("expenses");
      const opened=g.missing? [] : await open(g.data, "expenses");
      if (opened===undefined){ lastErr="家計簿が別の合言葉で保存されています"; break; }
      const remote=Array.isArray(opened)? opened : [];
      const merged=mergeExp(remote, expenses);
      const json=JSON.stringify(merged);
      if (!g.missing && json===pushed.expenses){ sha.expenses=g.sha; break; }
      const r=await ghPut("expenses", await seal(merged), g.sha, "家計：家計簿を更新");
      if (r.conflict) continue;
      sha.expenses=r.sha; pushed.expenses=json; lastErr="";
      expenses=merged; syncedIds=new Set(merged.map(e=>e.id));
      if (!editing()) render();
      break;
    }
  }catch(e){ lastErr=e.message; toast("保存できませんでした："+e.message); }
  busy--; setSync();
}

/* GitHub側の内容を取り込む。入力中は pending に置いて、手が止まってから反映する */
function adoptSettings(data){
  const inc=normalize(clone(data));
  const json=JSON.stringify(inc);
  if (json===JSON.stringify(S)){ pushed.settings=json; settingsDirty=false; return false; }
  /* まだ送れていない変更があるうちに相手の内容を当てると、足したばかりの項目が消える。
     こちらを優先して送り直す（設定は後から保存した側が残る決まり）。 */
  if (settingsDirty){ scheduleSave(true); return false; }
  if (editing()){ pending=inc; return false; }
  S=inc; pushed.settings=json; saveLocalSettings(); return true;
}
function adoptExpenses(remote){
  const list=Array.isArray(remote)? remote.filter(e=>e&&e.id && !deletedIds.has(e.id)) : [];
  const remoteIds=new Set(list.map(e=>e.id));
  /* まだGitHubに送れていない分だけ残す（相手が消した分を復活させない） */
  const unsent=expenses.filter(e=>e&&e.id && !remoteIds.has(e.id) && !syncedIds.has(e.id));
  const next=sortExp(list.concat(unsent));
  syncedIds=remoteIds;
  const changed=JSON.stringify(next)!==JSON.stringify(expenses);
  expenses=next; saveLocalExpenses();
  if (!unsent.length) pushed.expenses=JSON.stringify(next);
  return changed;
}

/* 読めなくなったファイルを、この端末が持っている内容で書き直す。
   合言葉を変えるときにも使う。相手のファイルを読んでからすり合わせる普通の保存だと、
   古い合言葉で読めないファイルが永久に取り残されてしまうため。 */
async function forceReplace(key){
  const value = key==="expenses"? sortExp(expenses) : key==="chat"? sortChat(chat)
              : key==="todos"? sortTodos(todos) : clone(S);
  for (let i=0;i<3;i++){
    const g=await ghGet(key).catch(()=>({missing:true, sha:null}));
    const r=await ghPut(key, await seal(value), g.sha, "家計："+FILE_LABEL[key]+"を今の合言葉で書き直す");
    if (r.conflict) continue;
    sha[key]=r.sha; pushed[key]=JSON.stringify(value); encTrouble.delete(key);
    if (key==="expenses") syncedIds=new Set(value.map(e=>e.id));
    if (key==="chat") syncedChat=new Set(value.map(m=>m.id));
    if (key==="todos") syncedTodo=new Set(value.map(t=>t.id));
    return true;
  }
  return false;
}
async function rekeyAll(){
  busy++; setSync();
  try{
    for (const k of ["settings","expenses","chat","todos"]) await forceReplace(k);
    lastErr="";
  }catch(e){ lastErr=e.message; toast("書き直せませんでした："+e.message); }
  busy--; setSync();
}

async function pull(){
  if (mode==="local" || localDirty || busy || drag) return;
  try{
    const [gs,ge,gc,gt]=await Promise.all([ghGet("settings"), ghGet("expenses"), ghGet("chat"), ghGet("todos")]);
    lastErr="";
    let changed=false;
    const wasLocked=locked;
    if (gs.missing){ sha.settings=null; } else { sha.settings=gs.sha; const v=await open(gs.data, "settings"); if(v) changed=adoptSettings(v)||changed; }
    if (ge.missing){ sha.expenses=null; syncedIds=new Set(); } else { sha.expenses=ge.sha; const v=await open(ge.data, "expenses"); if(v!==undefined) changed=adoptExpenses(v)||changed; }
    if (gc.missing){ sha.chat=null; syncedChat=new Set(); } else { sha.chat=gc.sha; const v=await open(gc.data, "chat"); if(v!==undefined) changed=adoptChat(v)||changed; }
    if (gt.missing){ sha.todos=null; syncedTodo=new Set(); } else { sha.todos=gt.sha; const v=await open(gt.data, "todos"); if(v!==undefined) changed=adoptTodos(v)||changed; }
    if ((changed || locked!==wasLocked) && !editing()) render();
  }catch(e){ lastErr=e.message; }
  setSync();
}
function startPoll(){
  clearInterval(pollTimer);
  const ms=POLL_MS[mode]; if(!ms) return;
  pollTimer=setInterval(pull, ms);
}

async function ghConnect(tk){
  tk=String(tk||"").trim();
  if (!tk){ toast("トークンを貼り付けてください"); return; }
  const prev=token; token=tk;
  busy++; setSync();
  try{
    const r=await ghFetch(API, {headers:ghHeaders(), cache:"no-store"});
    if (!r.ok) throw new Error(await ghErr(r, "repo"));
    const info=await r.json();
    if (info.permissions && info.permissions.push===false) throw new Error("このトークンには書き込みの権限がありません");
    const gs=await ghGet("settings");
    const gsv=gs.missing? null : await open(gs.data, "settings");
    if (gsv===undefined) throw new Error("GitHub側は合言葉で暗号化されています。つないだあとに合言葉を入れてください");
    if (gsv){
      const remoteFirst = confirm("GitHubに保存されている内容を読み込みますか？\n\nOK：GitHub側の内容にそろえる\nキャンセル：この端末の内容でGitHub側を上書きする");
      if (remoteFirst){ sha.settings=gs.sha; S=normalize(clone(gsv)); pushed.settings=JSON.stringify(S); saveLocalSettings(); }
      else { sha.settings=gs.sha; pushed.settings=null; }
    } else { sha.settings=gs.missing? null : gs.sha; pushed.settings=null; }
    const ge=await ghGet("expenses");
    if (!ge.missing){ sha.expenses=ge.sha; const v=await open(ge.data, "expenses"); if(v!==undefined) adoptExpenses(v); } else { sha.expenses=null; syncedIds=new Set(); }
    try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
    mode="github"; localDirty=false; lastErr=""; connectErr="";
    busy--; setSync();
    await pushSettings();
    if (expenses.length) await pushExpenses();
    startPoll(); render(); toast("GitHubにつなぎました。2人で同期します");
    return;
  }catch(e){
    token=prev; lastErr=""; busy--; setSync();
    connectErr=e.message; render();
    alert("つなげませんでした。\n\n"+e.message);
  }
}
function ghDisconnect(){
  if (!confirm("この端末のトークンを消して、同期をやめますか？（GitHub側のデータはそのまま残ります）")) return;
  token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  if (pass && confirm("合言葉もこの端末から消しますか？（消すと、次に開いたときに入れ直しになります）")){
    pass=""; cryptoKey=null; cryptoSalt=null; try{ localStorage.removeItem(PASS_KEY); }catch(e){}
  }
  mode = sha.settings || sha.expenses ? "readonly" : "local";
  localDirty=false; lastErr=""; startPoll(); setSync(); render(); toast("同期をやめました");
}

async function boot(){
  const invite=takeInviteToken();
  try{ token=invite.token||(localStorage.getItem(TOKEN_KEY)||"").trim(); }catch(e){ token=invite.token; }
  try{ pass=invite.pass||(localStorage.getItem(PASS_KEY)||""); }catch(e){ pass=invite.pass; }
  if (invite.token){ try{ localStorage.setItem(TOKEN_KEY, invite.token); }catch(e){} }
  if (invite.pass){ try{ localStorage.setItem(PASS_KEY, invite.pass); }catch(e){} }
  loadLocal(); setSync(); render();
  try{
    const [gs,ge]=await Promise.all([ghGet("settings"), ghGet("expenses")]);
    if (gs.missing && ge.missing && !token){ mode="local"; setSync(); return; }
    mode = token ? "github" : "readonly";
    if (!gs.missing){ sha.settings=gs.sha; const v=await open(gs.data, "settings"); if(v) adoptSettings(v); }
    if (!ge.missing){ sha.expenses=ge.sha; const v=await open(ge.data, "expenses"); if(v!==undefined) adoptExpenses(v); }
    const gc=await ghGet("chat").catch(()=>({missing:true}));
    if (!gc.missing){ sha.chat=gc.sha; const v=await open(gc.data, "chat"); if(v!==undefined) adoptChat(v); }
    const gt=await ghGet("todos").catch(()=>({missing:true}));
    if (!gt.missing){ sha.todos=gt.sha; const v=await open(gt.data, "todos"); if(v!==undefined) adoptTodos(v); }
    render(); setSync(); startPoll();
    if (invite.token && mode==="github" && !locked) toast("招待リンクからつなぎました");
    if (mode==="github" && !locked){ await pushSettings(); if(expenses.length) await pushExpenses(); if(chat.length) await pushChat(); if(todos.length) await pushTodos(); }
  }catch(e){
    mode="local"; lastErr=e.message; setSync();
    if (invite.token){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e2){} }
    if (token) toast("GitHubにつなげませんでした："+e.message);
  }
}
/* ===== 自動更新 =====
   「ホーム画面に追加」で使うと、ブラウザが古いページを抱え込んで新しい版に変わらない。
   sw.js が毎回ネットワークを先に見に行き、新しい版が用意できたら、
   入力中でない頃合いを見て自動で入れ替える。 */
let swReg=null, updateReady=false, swapping=false;
const hadController = ("serviceWorker" in navigator) && !!navigator.serviceWorker.controller;

function updateBlocked(){
  const a=document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return true;   /* 入力中は待つ */
  if (busy>0) return true;                                          /* 保存中は待つ */
  if (typeof ocrBusy!=="undefined" && ocrBusy) return true;         /* 読み取り中は待つ */
  return false;
}
function applyUpdate(){
  if (!updateReady || swapping) return;
  if (updateBlocked()){ setTimeout(applyUpdate, 5000); return; }
  swapping=true;
  toast("新しい版に切り替えます…");
  setTimeout(()=>{
    if (swReg && swReg.waiting) swReg.waiting.postMessage({type:"SKIP_WAITING"});
    else location.reload();
  }, 700);
}
function noteUpdate(){
  if (updateReady) return;
  updateReady=true;
  applyUpdate();
}
async function setupSW(){
  if (!("serviceWorker" in navigator) || location.protocol==="file:") return;
  try{
    swReg=await navigator.serviceWorker.register("sw.js", {scope:"./", updateViaCache:"none"});
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      /* 初めて取り付けたときは切り替えではないので、読み込み直さない */
      if (!hadController && !swapping) return;
      if (swapping || hadController){ swapping=true; location.reload(); }
    });
    if (swReg.waiting && hadController) noteUpdate();
    swReg.addEventListener("updatefound", ()=>{
      const nw=swReg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", ()=>{
        if (nw.state==="installed" && navigator.serviceWorker.controller) noteUpdate();
      });
    });
    setInterval(()=>{ if(swReg) swReg.update().catch(()=>{}); }, 30*60*1000);
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden) return;
  pull();
  if (swReg) swReg.update().catch(()=>{});
  applyUpdate();
});
window.addEventListener("focus", ()=>{ pull(); applyUpdate(); });

/* ===== レシートの読み取り =====
   同梱した Tesseract（vendor/）をブラウザの中だけで動かす。画像はどこにも送らないし保存もしない。
   読み取った値はそのまま登録せず、記録欄に入れて確認してもらう。 */
let ocrWorker=null, ocrBusy=false;
function ocrSay(msg){ const el=$("#ocrStat"); if(el) el.innerHTML=msg; }

async function loadScript(src){
  if (window.Tesseract) return;
  await new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src=src; sc.onload=res;
    sc.onerror=()=>rej(new Error("読み取りの部品を読み込めませんでした"));
    document.head.appendChild(sc);
  });
}
async function getOcr(){
  if (ocrWorker) return ocrWorker;
  await loadScript("vendor/tesseract.min.js");
  ocrWorker=await Tesseract.createWorker("jpn", 1, {
    workerPath:"vendor/worker.min.js",
    corePath:"vendor/",
    langPath:"vendor/",
    gzip:false,
    logger:m=>{
      const pct=Math.round((m.progress||0)*100);
      if (m.status==="loading language traineddata" || m.status==="loading tesseract core")
        ocrSay("読み取りの準備中… "+pct+"%（初回だけ約5MB取得します）");
      else if (m.status==="recognizing text") ocrSay("読み取り中… "+pct+"%");
    }
  });
  return ocrWorker;
}
/* 撮った写真はそのままだと大きすぎたり薄かったりするので、
   長辺1600pxに整えて白黒にし、明暗を伸ばしてから渡す */
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("画像を読み込めませんでした")); i.src=url; });
    const long=Math.max(img.width,img.height)||1, k=Math.min(2, 1600/long);
    const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const cx=cv.getContext("2d", {willReadFrequently:true});
    cx.drawImage(img,0,0,w,h);
    const d=cx.getImageData(0,0,w,h), a=d.data;
    const hist=new Uint32Array(256);
    for(let i=0;i<a.length;i+=4){ const g=(a[i]*299+a[i+1]*587+a[i+2]*114)/1000|0; a[i]=a[i+1]=a[i+2]=g; hist[g]++; }
    const total=w*h; let lo=0, hi=255, acc=0;
    for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>total*0.02){ lo=v; break; } }
    acc=0; for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>total*0.02){ hi=v; break; } }
    const span=Math.max(1,hi-lo);
    for(let i=0;i<a.length;i+=4){ const g=Math.max(0,Math.min(255,Math.round((a[i]-lo)*255/span))); a[i]=a[i+1]=a[i+2]=g; }
    cx.putImageData(d,0,0);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}

const RCPT_CAT=[
  ["food", /(スーパー|マート|ストア|ツルヤ|デリシア|綿半|イオン|西友|ベイシア|業務スーパー|食品|青果|精肉|鮮魚|ベーカリー|パン)/],
  ["life", /(ドラッグ|薬局|ウエルシア|ツルハ|サンドラッグ|マツモトキヨシ|ホームセンター|カインズ|コメリ|ニトリ|無印|ダイソー|セリア|クリーニング)/],
  ["car",  /(ENEOS|エネオス|出光|コスモ石油|apollostation|ガソリン|給油|オートバックス|車検|高速|ETC)/i],
  ["fun",  /(レストラン|カフェ|コーヒー|居酒屋|ラーメン|焼肉|寿司|スターバックス|ドトール|マクドナルド|すき家|吉野家|ガスト|サイゼリヤ|映画|水族館|美術館)/],
  ["util", /(電気料金|ガス料金|水道|灯油|中部電力|東京電力)/],
  ["comm", /(ドコモ|ソフトバンク|楽天モバイル|通信料|光回線|ワイモバイル)/i]
];
/* OCRは「2,178」を「2, 178」のように空白付きで返すことがある。
   全角を半角に直し、桁区切りで分かれた数字をつなぎ直してから読む。 */
function normText(t){
  return String(t||"")
    .replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[，、]/g, ",")
    .replace(/[．]/g, ".")
    .replace(/[￥]/g, "¥")
    .replace(/(\d)\s*[,.'`\u00b7\u30fb]\s*(?=\d{3}(?!\d))/g, "$1");
}
/* 保存ファイルから来たURLをそのままリンクにすると危ないので、http(s) のものだけ通す */
function linkOk(u){ return /^https?:\/\//i.test(String(u||"").trim()); }
function linkHost(u){
  try{ return new URL(String(u).trim()).hostname.replace(/^www\./,""); }catch(e){ return ""; }
}

function pickNums(line){
  const t=String(line).replace(/(\d)\s+(?=\d{3}(?!\d))/g, "$1");
  return [...t.matchAll(/([0-9]+)/g)]
    .map(m=>+m[1])
    .filter(n=>n>0 && n<2000000);
}
function parseReceipt(raw){
  const text=normText(raw);
  const lines=text.split(/\r?\n/).map(l=>l.replace(/[ \t\u3000]+/g," ").trim()).filter(Boolean);
  const TOTAL=/(合\s*計|お会計|ご請求|請求額|総額|お買上)/;
  /* 「税込合計」は拾いたいので、税そのものの行だけを外す */
  const SKIP=/(小\s*計|お預|預り|お釣|釣銭|おつり|現金|クレジット|ポイント|値引|割引|消費税|内税|外税|税額|点数|個数)/;
  let amount=0;
  for (let i=0;i<lines.length;i++){
    const l=lines[i];
    if (!TOTAL.test(l) || SKIP.test(l)) continue;
    let ns=pickNums(l);
    if (!ns.length && lines[i+1]) ns=pickNums(lines[i+1]);
    if (ns.length) amount=Math.max(...ns);
  }
  if (!amount){
    const cand=[];
    lines.forEach(l=>{ if(/[¥￥]|円/.test(l) && !SKIP.test(l)) cand.push(...pickNums(l)); });
    if (cand.length) amount=Math.max(...cand);
  }
  let date="";
  const t=text.replace(/[\s\u3000]+/g,"");
  let m=t.match(/(20\d{2})[年/\-.](\d{1,2})[月/\-.](\d{1,2})/);
  if (!m){ const r=t.match(/令和(\d{1,2})年(\d{1,2})月(\d{1,2})/); if(r) m=[null, String(2018+ +r[1]), r[2], r[3]]; }
  if (!m){ const r=t.match(/[RＲ](\d{1,2})[./](\d{1,2})[./](\d{1,2})/); if(r) m=[null, String(2018+ +r[1]), r[2], r[3]]; }
  if (m){
    const y=+m[1], mo=+m[2], da=+m[3];
    if (mo>=1&&mo<=12&&da>=1&&da<=31){
      const d=new Date(y,mo-1,da), now=Date.now();
      if (d.getTime()<now+86400000*2 && d.getTime()>now-86400000*730)
        date=y+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0");
    }
  }
  let store="";
  for (const l of lines.slice(0,6)){
    if (/[ぁ-んァ-ヶ一-龠A-Za-z]/.test(l) && !/^[0-9\-/:]+$/.test(l) && l.length>=2 && l.length<=24){ store=l; break; }
  }
  let cat="";
  for (const [k,re] of RCPT_CAT){ if (re.test(text)){ cat=k; break; } }
  return {amount, date, store, cat, lines};
}

async function readReceipt(file){
  if (ocrBusy) return;
  ocrBusy=true;
  try{
    ocrSay("画像を整えています…");
    const cv=await prepImage(file);
    const w=await getOcr();
    const {data}=await w.recognize(cv);
    const r=parseReceipt(data.text||"");
    const amt=$("#e-amount"), dt=$("#e-date"), ct=$("#e-cat"), mm=$("#e-memo");
    const got=[];
    if (r.amount && amt){ amt.value=r.amount; got.push("金額 "+yen(r.amount)); }
    if (r.date && dt){ dt.value=r.date; got.push("日付 "+Number(r.date.slice(5,7))+"/"+Number(r.date.slice(8,10))); }
    if (r.cat && ct){ ct.value=r.cat; got.push("分類 "+glabel(r.cat)); }
    if (r.store && mm && !mm.value){ mm.value=r.store; got.push("メモ "+r.store); }
    if (!got.length) ocrSay('<b style="color:var(--bad)">読み取れませんでした。</b>明るい場所で、レシート全体がまっすぐ入るように撮ると読めることがあります。手で入力してください。');
    else ocrSay("読めました：<b>"+esc(got.join("・"))+"</b><br>合っているか確かめてから「記録する」を押してください。");
    if (amt && r.amount) amt.focus();
  }catch(e){
    ocrSay('<b style="color:var(--bad)">'+esc(e.message||"読み取りに失敗しました")+'</b>');
  }
  ocrBusy=false;
}

function statusFor(ratio, good, warn){ return ratio<=good? "good" : ratio<=warn? "warn" : "bad"; }

function donut(){
  const total=monthly()||1, R=62, C=2*Math.PI*R; let acc=0;
  const segs = GROUPS.map(g=>{ const v=groupSum(g.k); if(!v) return ""; const len=v/total*C; const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke-width="22" style="stroke:var(--c-${g.k})" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`; acc+=len; return s; }).join("");
  const legend = GROUPS.filter(g=>groupSum(g.k)).map(g=>{ const v=groupSum(g.k); return `<li><i style="background:var(--c-${g.k})"></i><span>${g.label}</span><span class="num">${yen(v)}</span><span class="p">${Math.round(v/total*100)}%</span></li>`; }).join("");
  return `<div class="donut"><svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="毎月の生活費の内訳">
    <circle r="${R}" cx="80" cy="80" fill="none" stroke-width="22" style="stroke:var(--surface-2)"/>${segs}
    <text x="80" y="74" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--f-body)">毎月</text>
    <text x="80" y="96" text-anchor="middle" style="fill:var(--ink);font-size:20px;font-weight:600">${man(total)}</text></svg>
    <ul class="legend">${legend}</ul></div>`;
}

function utilChart(){
  const vals=utilByMonth(), W=640,H=230,L=52,Rp=10,T=22,B=30;
  const maxV=Math.max(...vals,1), step=maxV>40000?10000:5000, top=Math.ceil(maxV/step)*step;
  const iw=(W-L-Rp)/12, bw=iw*0.62, y=v=>T+(H-T-B)*(1-v/top);
  const maxI=vals.indexOf(Math.max(...vals)), minI=vals.indexOf(Math.min(...vals));
  let g="";
  for(let t=0;t<=top;t+=step*(top/step>4?2:1)){ g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" style="fill:var(--faint);font-size:11px">${t?man(t):"0"}</text>`; }
  const bars=vals.map((v,i)=>{ const x=L+iw*i+(iw-bw)/2, winter=[0,1,2,11].includes(i);
    const lab = (i===maxI||i===minI)? `<text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:600">${yen(v)}</text>`:"";
    return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,H-B-y(v))}" rx="4" style="fill:var(--c-util);opacity:${winter?1:.55}"/>${lab}<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--f-body)">${i+1}月</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の光熱費の見込み">${g}${bars}</svg>`;

function savingsChart(p){
  const W=640,H=230,L=52,Rp=16,T=20,B=30;
  const nowYm=p.nowYm; let N = isFinite(p.months)? Math.max(p.months, p.until) : Math.max(p.until,12); N=Math.min(Math.max(N,3),48);
  const pts=[]; for(let k=0;k<=N;k++){ let v=p.cum[k]; if(v==null){ v=p.cum[p.cum.length-1]; for(let i=p.cum.length-1;i<k;i++) v+=monthRow(addMonths(nowYm,i)).total; } pts.push(Math.min(v, p.tgt*1.15)); }
  const top=Math.max(p.tgt*1.1, ...pts, 1), x=k=>L+(W-L-Rp)*k/N, y=v=>T+(H-T-B)*(1-v/top);
  const step = top>1500000?500000: top>600000?200000:100000;
  let g=""; for(let t=0;t<=top;t+=step){ g+=`<line x1="${L}" x2="${W-Rp}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" style="fill:var(--faint);font-size:11px">${t?man(t):"0"}</text>`; }
  const every = N>24?6: N>12?3:2; let xl="";
  for(let k=0;k<=N;k+=every){ const ym=addMonths(nowYm,k); xl+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${ym.slice(2,4)}/${Number(ym.slice(5))}</text>`; }
  const line=pts.map((v,k)=>`${k?"L":"M"}${x(k).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const area=line+` L${x(N)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const mi=Math.min(p.until,N);
  const move = `<line x1="${x(mi)}" x2="${x(mi)}" y1="${T}" y2="${H-B}" style="stroke:var(--pb)" stroke-width="1.5" stroke-dasharray="3 4"/><text x="${x(mi)+(mi>N*0.75?-6:6)}" y="${T+10}" text-anchor="${mi>N*0.75?"end":"start"}" style="fill:var(--pb);font-size:11px;font-family:var(--f-body);font-weight:700">入居したい月</text>`;
  let reach=""; if(isFinite(p.months) && p.months<=N){ reach=`<circle cx="${x(p.months)}" cy="${y(pts[p.months])}" r="5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="貯金の見通し">${g}
    <path d="${area}" style="fill:var(--accent);opacity:.12"/><path d="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="${L}" x2="${W-Rp}" y1="${y(p.tgt)}" y2="${y(p.tgt)}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="${W-Rp}" y="${y(p.tgt)-6}" text-anchor="end" style="fill:var(--ink);font-size:11px;font-family:var(--f-body);font-weight:700">目標 ${yen(p.tgt)}</text>
    ${move}${reach}${xl}</svg>`;
}

/* 期限の切迫ぐあい。色分けの元になる
   over=過ぎている / soon=3日以内 / later=まだ先 / none=期限なし */
function dueState(t){
  if (t.done) return "st-done";
  if (!t.due) return "st-none";
  const today=todayStr();
  if (t.due<today) return "st-over";
  const d=new Date(t.due), n=new Date(today);
  return (d-n)<=86400000*3 ? "st-soon" : "st-later";
}
function dueLabel(due){
  if (!due) return "";
  const today=todayStr();
  if (due===today) return "今日";
  const t=new Date(today); t.setDate(t.getDate()+1);
  const tom=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  if (due===tom) return "明日";
  return Number(due.slice(5,7))+"/"+Number(due.slice(8,10));
}
function todoCard(){
  const open_=todos.filter(t=>!t.done), done=todos.filter(t=>t.done);

  const rows=sortTodos(todos).map(t=>{
    const st=dueState(t), who=(t.by===0||t.by===1)? S.names[t.by] : "";
    const dl=t.due? dueLabel(t.due) : (t.done? "" : "期限なし");
    return `<li class="todo ${st}">

function scheduleCard(p){
  const N = Math.min(48, Math.max(12, p.until+1, isFinite(p.months)? p.months+1 : 0));
  let cum=p.cur, rows="";
  const moveYm=S.savings.moveIn, reachYm=p.reach;
  for(let i=0;i<N;i++){
    const r=monthRow(addMonths(p.nowYm,i)); cum+=r.total;
    const isMove=r.ym===moveYm, isReach=r.ym===reachYm, bsum=r.bonus[0]+r.bonus[1];
    const cell = k=>`<td><span class="yenwrap" style="display:inline-block;width:118px"><input class="in yen ${r.ov?"ov":""}" type="number" inputmode="numeric" min="0" step="5000" id="ov-${esc(r.ym)}-${k}" data-ov="${esc(r.ym)}" data-p="${k}" value="${r.reg[k]}" aria-label="${ymLabel(r.ym)}の${esc(S.names[k])}の貯金額"></span></td>`;
    rows += `<tr class="${isMove?"cur":""}">
      <td><span style="font-weight:${isMove?700:500}">${Number(r.ym.slice(5))===1||i===0? r.ym.slice(0,4)+"年":""}${Number(r.ym.slice(5))}月</span>
        ${isMove?`<span class="pill neutral" style="margin-left:6px;background:var(--pb-soft);color:var(--pb)">入居したい月</span>`:""}
        ${isReach?`<span class="pill good" style="margin-left:6px">目標達成</span>`:""}</td>
      ${cell(0)}${cell(1)}
      <td class="num">${bsum? `<span style="color:var(--accent);font-weight:600">＋${yen(bsum).slice(1)}</span>`:`<span style="color:var(--faint)">—</span>`}</td>
      <td class="num" style="font-weight:600">${yen(r.total)}</td>
      <td class="num">${yen(cum)}</td>
      <td style="width:36px">${r.ov?`<button class="icon" data-act="resetOv" data-ym="${esc(r.ym)}" aria-label="${ymLabel(r.ym)}をふだんの額に戻す" title="ふだんの額に戻す" style="color:var(--accent)">↺</button>`:""}</td>
    </tr>`;
  }
  const nOv=Object.keys(S.savings.overrides||{}).length;
  return `<section class="card s12">
    <div class="row between"><div><h2>月ごとの貯金スケジュール</h2>
      <p class="sub">金額を書き換えると、その月だけ変更されます（帰省や旅行で少ない月、臨時収入で多い月など）。色つきの欄が変更した月です</p></div>
      ${nOv?`<button class="btn small" data-act="resetAllOv">すべてふだんの額に戻す（${nOv}か月分）</button>`:""}</div>
    <div class="tablewrap"><table class="sched" style="min-width:720px">
      <thead><tr><th>月</th><th>${esc(S.names[0])}</th><th>${esc(S.names[1])}</th><th>ボーナス</th><th>その月の合計</th><th>貯金の累計</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="note">累計は「いまの貯金 ${yen(p.cur)}」からスタート。ボーナスの金額は左の「ボーナスから貯金する額」で変更できます。</p>
  </section>`;
}

function dayLabel(ms){
  const d=new Date(ms), t=new Date(), y=new Date(t.getTime()-86400000);
  const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  if (same(d,t)) return "今日";
  if (same(d,y)) return "昨日";
  return (d.getMonth()+1)+"月"+d.getDate()+"日";
}
function hhmm(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

      <button class="btn primary" type="submit">送る</button>
    </form>
    ${pass? "" : `<p class="note">いまは暗号化されていないので、書いた内容はGitHub上で誰でも読めます。「毎月の予算」タブで合言葉をかけられます。</p>`}
  </section></div>`;
}

function render(){
  if (drag) return;   /* 並べ替えの最中は描き直さない */
  $("#nameA").textContent=S.names[0]; $("#nameB").textContent=S.names[1];
  $("#dotA").textContent=(S.names[0]||"A").slice(0,1); $("#dotB").textContent=(S.names[1]||"B").slice(0,1);
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  const v=$("#view"), nav=document.querySelector("nav.tabs");
  if (nav) nav.style.display = locked? "none" : "";
  if (locked){ v.innerHTML=lockCard(); return; }
  const un=unreadCount();
  const ct=document.querySelector('[data-tab="chat"]');
  if (ct) ct.innerHTML = "チャット"+(un&&tab!=="chat"? `<span class="tabdot" aria-label="新しい発言があります"></span>` : "");
  v.innerHTML = troubleCard() + (tab==="home"?viewHome(): tab==="initial"?viewInitial(): tab==="budget"?viewBudget():
                tab==="chat"?viewChat(): viewLog());
  if (tab==="chat"){
    const w=$("#chatwrap"); if(w) w.scrollTop=w.scrollHeight;
    markChatSeen();
  }
  growAll();
}

/* ===== 長押しで並べ替え（初期費用） =====
   同じまとまりの中だけで動かせる。優先順位を上から並べるための機能。
   文字入力やボタンの上から始まったときは並べ替えにしない。 */
let drag=null, pressTimer=null, pressX=0, pressY=0;
const PRESS_MS=420, PRESS_SLOP=8;

function rowsOf(g){ return [...document.querySelectorAll('.item.chk[data-g="'+CSS.escape(g)+'"]')]; }
function clearPress(){ clearTimeout(pressTimer); pressTimer=null; }

function startDrag(el, pointerId){
  pressTimer=null;
  drag={el, g:el.dataset.g};
  el.classList.add("dragging");
  document.body.classList.add("dragbusy");
  try{ el.setPointerCapture(pointerId); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}
function endDrag(){
  if (!drag) return;
  const {el,g}=drag;
  el.classList.remove("dragging");
  document.body.classList.remove("dragbusy");
  const order=rowsOf(g).map(r=>+r.dataset.idx);
  drag=null;
  applyInitialOrder(g, order);
}
function applyInitialOrder(g, order){
  const slots=[]; S.initial.forEach((x,i)=>{ if(x.g===g) slots.push(i); });
  if (slots.length!==order.length || order.some(i=>!S.initial[i])){ render(); return; }
  const objs=order.map(i=>S.initial[i]);
  const same=slots.every((pos,k)=>S.initial[pos]===objs[k]);
  slots.forEach((pos,k)=>{ S.initial[pos]=objs[k]; });
  if (same){ render(); return; }
  commit(true);
  toast("並べ替えました");
}

document.addEventListener("pointerdown", e=>{
  if (e.pointerType==="mouse" && e.button!==0) return;
  const el=e.target.closest(".item.chk[data-idx]");
  if (!el || !canWrite()) return;
  /* つまみ（⠿）からは、すぐつかめる */
  if (e.target.closest("[data-grip]")){
    if (e.cancelable) e.preventDefault();
    startDrag(el, e.pointerId);
    return;
  }
  /* 行の余白からは長押しで。文字入力やボタンの上からは始めない */
  if (e.target.closest("input,button,select,textarea,label")) return;
  pressX=e.clientX; pressY=e.clientY;
  clearTimeout(pressTimer);
  const id=e.pointerId;
  pressTimer=setTimeout(()=>startDrag(el, id), PRESS_MS);
});
document.addEventListener("pointermove", e=>{
  if (pressTimer && (Math.abs(e.clientX-pressX)>PRESS_SLOP || Math.abs(e.clientY-pressY)>PRESS_SLOP)) clearPress();
  if (!drag) return;
  if (e.cancelable) e.preventDefault();
  const y=e.clientY;
  for (const r of rowsOf(drag.g)){
    if (r===drag.el) continue;
    const b=r.getBoundingClientRect(), mid=b.top+b.height/2;
    const after=!!(r.compareDocumentPosition(drag.el) & Node.DOCUMENT_POSITION_FOLLOWING);
    if (y<mid && after){ r.parentNode.insertBefore(drag.el, r); break; }
    if (y>mid && !after){ r.parentNode.insertBefore(drag.el, r.nextSibling); break; }
  }
}, {passive:false});
document.addEventListener("pointerup", ()=>{ clearPress(); endDrag(); });
document.addEventListener("pointercancel", ()=>{ clearPress(); endDrag(); });
/* 動かしている間は画面がスクロールしないようにする */
document.addEventListener("touchmove", e=>{ if(drag && e.cancelable) e.preventDefault(); }, {passive:false});

/* ---------- 操作 ---------- */
function setPath(path, val){
  const ks=path.split("."); let o=S; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val;
}
/* 折り返しで増えた行の分だけ高さを広げる */
function autoGrow(el){
  if (!el) return;
  el.style.height="auto";
  el.style.height=(el.scrollHeight+2)+"px";
}
function growAll(){ document.querySelectorAll("textarea.lbl").forEach(autoGrow); }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }
function commit(fast){ scheduleSave(fast); render(); }
function addTodo(text, due){
  text=String(text||"").trim();
  if (!text) return false;
  if (!canWrite()){ nudge(); return false; }
  todos=sortTodos(todos.concat([{id:uid()+uid(), text, due:due||"", done:false, by:me, at:Date.now()}]));
  saveTodosSoon(); render();
  return true;
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if (t.dataset.tab){ tab=t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.go){ tab=t.dataset.go; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.set){ S[t.dataset.set]=t.dataset.v; commit(); return; }
  if (t.dataset.payer!=null){ t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  const act=t.dataset.act; if(!act) return;
  if (act==="area"){ const a=areaOf(t.dataset.v); if(!AREAS[t.dataset.v]) return; S.area=t.dataset.v;
    const g=S.budget.find(b=>b.id==="gas"); if(g){g.amt=a.gas; g.label=a.gasLabel;}
    const p=S.budget.find(b=>b.id==="park"); if(p) p.amt=a.park; commit(); toast(a.label+"の目安にしました"); }
  if (act==="toggleEdit"){ editBudget=!editBudget; render(); if(editBudget){ const q=$("#quickEdit"); if(q) q.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  if (act==="addBonus"){ S.savings.bonuses.push({id:uid(),label:"ボーナス",m:7,amt:[0,0]}); commit(true); }
  if (act==="delBonus"){ S.savings.bonuses.splice(+t.dataset.i,1); commit(true); }
  if (act==="resetOv"){ delete S.savings.overrides[t.dataset.ym]; commit(); }
  if (act==="resetAllOv"){ if(confirm("月ごとに変更した貯金額を、すべてふだんの額に戻しますか？")){ S.savings.overrides={}; commit(); toast("ふだんの額に戻しました"); } }
  if (act==="addBud"){ S.budget.push({id:uid(),g:t.dataset.g,label:"新しい項目",amt:0}); commit(true); }
  if (act==="delBud"){ S.budget.splice(+t.dataset.i,1); commit(true); }
  if (act==="addInit"){ S.initial.push({id:uid(),g:t.dataset.g,label:"新しい項目",amt:0,off:false}); commit(true); }
  if (act==="toggleNote"){
    const id=t.dataset.id;
    if (openNotes.has(id)) openNotes.delete(id); else openNotes.add(id);
    render();
    const el=$("#nt-"+CSS.escape(id)); if(el) el.focus();
    return; }
  if (act==="delInit"){ S.initial.splice(+t.dataset.i,1); commit(true); }
  if (act==="resetBudget"){ if(confirm("毎月の予算を目安の金額に戻しますか？（収入や家計簿はそのままです）")){ S.budget=clone(DEFAULT.budget); const a=areaOf(S.area); const g=S.budget.find(b=>b.id==="gas"); g.amt=a.gas; g.label=a.gasLabel; S.budget.find(b=>b.id==="park").amt=a.park; commit(); toast("目安の金額に戻しました"); } }
  if (act==="delExp"){ const id=t.dataset.id;
    if (!canWrite()){ nudge(); return; }
    deletedIds.add(id); expenses=expenses.filter(x=>x.id!==id); saveExpensesSoon(); render(); toast("削除しました"); }
  if (act==="ghConnect"){ const el=$("#ghToken"); const v=el?el.value:""; if(el) el.value=""; await ghConnect(v); return; }
  if (act==="ghDisconnect"){ ghDisconnect(); return; }
  if (act==="fixEnc"){
    if (!canWrite()){ nudge(); return; }
    const names=[...encTrouble].map(k=>FILE_LABEL[k]).join("・");
    if (!confirm(names+"を、この端末の内容で作り直しますか？\n\nGitHub上の"+names+"は上書きされ、読めないままの中身は戻せません。")) return;
    for (const k of [...encTrouble]) await forceReplace(k);
    render(); toast("作り直しました");
    return; }
  if (act==="relock"){
    pass=""; cryptoKey=null; cryptoSalt=null; locked=true; encTrouble.clear();
    try{ localStorage.removeItem(PASS_KEY); }catch(err){}
    render(); return; }
  if (act==="delTodo"){
    if (!canWrite()){ nudge(); return; }
    const id=t.dataset.id; deletedTodo.add(id); todos=todos.filter(x=>x.id!==id); saveTodosSoon(); render(); return; }
  if (act==="clearDone"){
    if (!canWrite()){ nudge(); return; }
    const gone=todos.filter(x=>x.done);
    if (!gone.length) return;
    if (!confirm("終わった"+gone.length+"件をリストから消しますか？")) return;
    gone.forEach(x=>deletedTodo.add(x.id));
    todos=todos.filter(x=>!x.done); saveTodosSoon(); render(); toast("消しました"); return; }
  if (act==="addSuggest"){
    if (!canWrite()){ nudge(); return; }
    addTodo(t.dataset.t, ""); return; }
  if (act==="setMe"){ me=+t.dataset.i; try{ localStorage.setItem(ME_KEY, String(me)); }catch(err){} markChatSeen(); render(); return; }
  if (act==="switchMe"){ me=null; try{ localStorage.removeItem(ME_KEY); }catch(err){} render(); return; }
  if (act==="delMsg"){
    if (!canWrite()){ nudge(); return; }
    const id=t.dataset.id;
    deletedChat.add(id); chat=chat.filter(m=>m.id!==id); saveChatSoon(); render(); return; }
  if (act==="passSet" || act==="passChange"){
    if (!canWrite()){ nudge(); return; }
    const p1=window.prompt(act==="passSet"
      ? "2人で決める合言葉を入れてください。\n\n忘れると、これまでのデータは誰にも読めなくなります。"
      : "新しい合言葉を入れてください。");
    if (p1===null) return;
    const v1=String(p1);
    if (v1.length<4){ alert("合言葉は4文字以上にしてください。"); return; }
    const p2=window.prompt("確認のため、もう一度同じ合言葉を入れてください。");
    if (p2===null) return;
    if (String(p2)!==v1){ alert("2回目が一致しませんでした。もう一度お試しください。"); return; }
    pass=v1; cryptoSalt=null; cryptoKey=null;
    try{ localStorage.setItem(PASS_KEY, pass); }catch(err){}
    await rekeyAll();
    render(); toast("合言葉をかけました。相手にも同じ合言葉を伝えてください");
    return; }
  if (act==="passClear"){
    if (!canWrite()){ nudge(); return; }
    if (!confirm("暗号化をやめますか？\n\nやめると、家計と家計簿の中身がGitHub上で誰にでも読める状態に戻ります。")) return;
    pass=""; cryptoSalt=null; cryptoKey=null;
    try{ localStorage.removeItem(PASS_KEY); }catch(err){}
    await rekeyAll();
    render(); toast("暗号化をやめました");
    return; }
  if (act==="ghInvite"){
    if (!canWrite()){ nudge(); return; }
    const url=inviteUrl();
    try{ await navigator.clipboard.writeText(url); toast("招待リンクをコピーしました"); }
    catch(err){ window.prompt("このリンクをコピーして相手に送ってください", url); }
    return; }
  if (act==="ghSync"){ await pull(); render(); toast("読み込みました"); return; }
  if (act==="export"){ const txt=JSON.stringify({settings:S, expenses}); $("#backup").value=txt;
    try{ await navigator.clipboard.writeText(txt); toast("コピーしました"); }catch(err){ $("#backup").select(); toast("テキストを選択しました。コピーして保存してください"); } }
  if (act==="import"){ try{ const d=JSON.parse($("#backup").value); if(!d.settings) throw 0;
      if(!confirm("いまの設定をバックアップの内容で置き換えますか？")) return;
      S=normalize(d.settings); scheduleSave();
      const add=(d.expenses||[]).filter(x=>!expenses.some(y=>y.id===x.id));
      expenses=expenses.concat(add); saveExpensesSoon();
      render(); toast("読み込みました"); }catch(err){ toast("読み込めませんでした。コピーしたテキストをそのまま貼り付けてください"); } }
});

document.addEventListener("keydown", e=>{
  const el=e.target;
  if (e.key==="Enter" && el.dataset && (el.dataset.f||el.dataset.ov) && (el.tagName==="INPUT" || el.classList.contains("lbl"))){ e.preventDefault(); el.blur(); }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if (el.tagName==="TEXTAREA" && el.classList.contains("lbl")) autoGrow(el);
  if(el.type==="range" && el.dataset.f){ setPath(el.dataset.f, +el.value); const o=document.getElementById(el.dataset.out); if(o) o.textContent=yen(+el.value); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if (el.dataset && el.dataset.todo!=null){
    if (!canWrite()){ el.checked=!el.checked; nudge(); return; }
    const t=todos.find(x=>x.id===el.dataset.todo);
    if (t){ t.done=el.checked; t.doneAt=el.checked? Date.now() : 0; saveTodosSoon(); render(); }
    return;
  }
  if (el.id==="rcpt"){ const f=el.files && el.files[0]; el.value=""; if(f) readReceipt(f); return; }
  if (el.id==="logMonth"){ if(el.value){ month=el.value; render(); } return; }
  if (el.dataset && el.dataset.ov){
    const ym=el.dataset.ov, k=+el.dataset.p, val=Math.max(0,Math.round(+el.value||0));
    const cur=S.savings.overrides[ym] || [null,null]; cur[k]=val;
    const base=[0,1].map(i=>+S.savings.monthly[i]||0);
    if ((cur[0]==null||cur[0]===base[0]) && (cur[1]==null||cur[1]===base[1])) delete S.savings.overrides[ym];
    else S.savings.overrides[ym]=cur;
  } else if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.f){
  let v = el.dataset.bool!=null ? el.checked : el.dataset.num!=null ? Math.max(0, Math.round(+el.value||0)) : el.value;
  if (el.dataset.f.startsWith("names.") && !String(v).trim()) v = el.dataset.f.endsWith("0")?"あなた":"パートナー";
  setPath(el.dataset.f, v);
  if (el.dataset.clearM!=null){ const it=S.initial[+el.dataset.clearM]; if(it) delete it.m; }
  }
  /* 再描画しても、Tabで移った先の入力欄にフォーカスを戻す */
  setTimeout(()=>{
    const a=document.activeElement, id=a&&a.id, y=window.scrollY;
    commit();
    if (id){ const n=document.getElementById(id); if(n){ n.focus({preventScroll:true}); if(n.type==="number") n.select(); } }
    window.scrollTo({top:y});
  },0);
});
document.addEventListener("focusout", ()=>{ setTimeout(()=>{
  if (!pending || editing()) return;
  if (settingsDirty){ pending=null; return; }   /* 自分の変更が未送信なら、相手の内容は当てない */
  S=pending; pending=null; render();
}, 60); });

document.addEventListener("submit", async e=>{
  if (e.target.id==="lockForm"){
    e.preventDefault();
    const v=$("#passIn").value;
    if (!v) return;
    const gs=await Promise.all([
      ghGet("settings").catch(()=>null), ghGet("expenses").catch(()=>null), ghGet("chat").catch(()=>null)]);
    const found=gs.filter(g=>g && !g.missing);
    if (!found.length){ toast("GitHubのデータが読めませんでした"); return; }
    let okAny=false;
    for (const g of found){ if (await canOpen(g.data, v)){ okAny=true; break; } }
    if (!okAny){ toast("合言葉が違います"); return; }
    pass=v; cryptoKey=null; cryptoSalt=null; locked=false; encTrouble.clear();
    try{ localStorage.setItem(PASS_KEY, pass); }catch(err){}
    await pull(); render();
    toast(encTrouble.size? [...encTrouble].map(k=>FILE_LABEL[k]).join("・")+"はこの合言葉では読めません" : "開きました");
    return;
  }
  if (e.target.id==="todoForm"){
    e.preventDefault();
    const el=$("#todoText"), due=$("#todoDue");
    if (addTodo(el.value, due? due.value : "")){
      const n=$("#todoText"); if(n){ n.value=""; n.focus(); }
      const d=$("#todoDue"); if(d) d.value="";
    }
    return;
  }
  if (e.target.id==="chatForm"){
    e.preventDefault();
    const el=$("#chatText"), text=(el.value||"").trim();
    if (!text) return;
    if (!canWrite()){ nudge(); return; }
    chat=sortChat(chat.concat([{id:uid()+uid(), who:me, text, at:Date.now()}])).slice(-MSG_MAX);
    el.value=""; saveChatSoon(); markChatSeen(); render();
    const w=$("#chatwrap"); if(w) w.scrollTop=w.scrollHeight;
    const n=$("#chatText"); if(n) n.focus();
    return;
  }
  if (e.target.id!=="expForm") return; e.preventDefault();
  const amount=Math.round(+$("#e-amount").value||0); if(amount<=0){ toast("金額を入力してください"); return; }
  const pb=document.querySelector('#e-payer [aria-pressed="true"]'); const pv=pb?pb.dataset.payer:"0";
  const rec={date:$("#e-date").value||todayStr(), cat:$("#e-cat").value, amount, payer: pv==="joint"?"joint":+pv, memo:$("#e-memo").value.trim(), createdAt:Date.now()};
  if (!canWrite()){ nudge(); return; }
  expenses.push(Object.assign({id:uid()},rec)); saveExpensesSoon();
  if (rec.date.slice(0,7)!==month) month=rec.date.slice(0,7);
  render(); toast(yen(amount)+" を記録しました");
  const a=$("#e-amount"); if(a) a.focus();
});

boot(); setupSW();
})();
</script>
